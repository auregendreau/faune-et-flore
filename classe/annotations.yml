# Ce que l'année 2026-2027 traite, période par période.
#
# Chaque bloc dit : dans ce document, à cette période, ces attendus-là sont
# travaillés — l'équivalent, pour une année déjà écrite en prose, de ce que
# chaque séance porterait si elle déclarait elle-même ce qu'elle sert.
#
# Granularité : le document et la période. C'est ce que permettent les
# tableaux existants (un tableau par période, une ligne par champ). Dans la
# plateforme, la maille sera la séance — ce qui donnera en plus le nombre de
# rencontres de chaque attendu, et non seulement leur existence.
#
# Établi en relisant les cinq tableaux de chacune des sept progressions.

annee: 2026-2027
classe: Grande Section
projet: À la découverte de la faune et de la flore

