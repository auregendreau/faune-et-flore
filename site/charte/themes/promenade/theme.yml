  - [--t-encre, --t-ciel-2]
  - [--t-encre, --t-creme]
  - [--t-encre, --t-pied]
  - [--t-encre, --t-jaune-pale]
  - [--t-encre, --t-vert-pale]
  - [--t-encre-douce, --t-blanc]
  - [--t-encre-douce, --t-ciel-2]
  - [--t-encre-douce, --t-creme]
  - [--t-encre-douce, --t-pied]
  - [--t-jaune, --t-encre]
  - [--t-blanc, --t-encre]
